name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # --keep-vars preserves plaintext Variables set in the Cloudflare
          # dashboard (e.g. STRIPE_PUBLISHABLE_KEY) across deploys. Without
          # this flag, every deploy strips any var not declared in wrangler.toml.
          command: deploy --keep-vars
