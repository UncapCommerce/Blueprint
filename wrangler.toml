name = "uncap-blueprint"
main = "worker/index.js"
compatibility_date = "2025-04-01"
account_id = "0ff8ba3297e0672ce4b1b53f66496300"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "blueprint.uncap.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Stores 6-digit verification codes (10-min TTL) and session tokens
# (24-hour TTL) for the blueprint auth flow. Reusing the namespace ID
# that used to back the /build reservation flow — the binding name is
# new but the underlying KV namespace is the same.
[[kv_namespaces]]
binding = "BLUEPRINT_AUTH"
id = "fefd368a592342a4a2682f286e70c906"

# Cloudflare-native outgoing email — used as a fallback for the admin
# notification to denis@uncap.com when Resend isn't configured. The
# recipient must be a verified destination in Email Routing.
[[send_email]]
name = "NOTIFY_MAIL"

[vars]
NOTIFY_EMAIL = "denis@uncap.com"
EMAIL_FROM   = "Uncap Blueprint <noreply@uncap.com>"
# Typing this string in the email field on any blueprint's login bypasses
# the 6-digit code step. Plain-text on purpose so admins can edit it
# without touching secrets; rotate by editing this line.
ADMIN_PASSCODE = "Uncap#CH"

# Secrets configured in the Cloudflare dashboard:
#   RESEND_API_KEY  (Secret)
# Required to send the 6-digit code to arbitrary client emails.
# Cloudflare's send_email binding can only send to addresses verified
# in Email Routing, so we use Resend for transactional code-delivery
# to client recipients. Admin notifications to denis@uncap.com prefer
# Resend (same FROM domain, no verification dance) and fall back to
# the send_email binding when Resend is absent.
