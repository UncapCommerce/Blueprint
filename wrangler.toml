name = "uncap-blueprint"
main = "worker/index.js"
compatibility_date = "2025-04-01"
account_id = "0ff8ba3297e0672ce4b1b53f66496300"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "blueprint.uncap.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Persists in-progress /build quiz sessions so visitors can resume from a
# `?s=<id>` URL after closing the tab. Created via the Cloudflare API.
[[kv_namespaces]]
binding = "BUILD_SESSIONS"
id = "fefd368a592342a4a2682f286e70c906"

# Cloudflare-native outgoing email. Binds env.NOTIFY_MAIL.send(...). The
# recipient (NOTIFY_EMAIL below) MUST be a verified destination address in
# Cloudflare Email Routing for the uncap.com zone — otherwise sends are
# rejected with "no matching destination address". No destination_address
# is pinned here so we can change NOTIFY_EMAIL in the future without
# redeploying.
[[send_email]]
name = "NOTIFY_MAIL"

[vars]
# Where fit-call form submissions and card-on-file notifications are emailed.
# Must be a verified destination address in Cloudflare Email Routing.
NOTIFY_EMAIL = "hay@uncap.com"
# From-address shown in the recipient's inbox. The bare address part must be
# on a zone you control (uncap.com is on Cloudflare so SPF/DKIM are handled
# automatically). Display name is free-form.
EMAIL_FROM = "Blueprint <noreply@uncap.com>"

# Attio CRM sync. Slugs match the object/attribute slugs in your Attio
# workspace; change here if you renamed anything. Everything except the
# API key is plaintext (no secrets), so they live in wrangler.toml.
ATTIO_BLUEPRINT_OBJECT         = "blueprint"
ATTIO_BLUEPRINT_NAME_ATTR      = "name"
ATTIO_BLUEPRINT_DETAILS_ATTR   = "details"
ATTIO_BLUEPRINT_STAGE_ATTR     = "new"
ATTIO_BLUEPRINT_STAGE_ORDERED  = "Ordered"
# Reference attributes on the Blueprint object that link out to People /
# Companies. Set to the slug of the attribute, or empty string to skip the
# link entirely. If the slug is set but the attribute doesn't exist on the
# Blueprint object, the create call retries without the ref so the record
# still lands (just without the link).
ATTIO_BLUEPRINT_PERSON_ATTR    = "team"
ATTIO_BLUEPRINT_COMPANY_ATTR   = "company"

# Stripe / Attio credentials are configured in the Cloudflare dashboard:
#   Workers & Pages → uncap-blueprint → Settings → "Variables and Secrets"
#
# Required:
#   STRIPE_SECRET_KEY       (Secret)    — sk_test_… / sk_live_…
#   STRIPE_PUBLISHABLE_KEY  (Variable)  — pk_test_… / pk_live_…  (public, plaintext)
#   ATTIO_API_KEY           (Secret)    — Attio API key (Settings → API & integrations)
#   APOLLO_API_KEY          (Secret)    — Apollo.io API key for /organizations/enrich
#
# Secrets always persist across deploys. Plaintext Variables only persist
# because every deploy passes `--keep-vars` (see package.json's
# `deploy` script). Without that flag, Wrangler strips any var not
# declared in this file on every deploy.
