name = "blueprint"
main = "worker/index.js"
compatibility_date = "2025-04-01"
account_id = "0ff8ba3297e0672ce4b1b53f66496300"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "blueprint.uncap.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Stores 6-digit verification codes (10-min TTL) and session tokens
# (24-hour TTL) for the blueprint auth flow.
[[kv_namespaces]]
binding = "BLUEPRINT_AUTH"
id = "fefd368a592342a4a2682f286e70c906"

# Cloudflare-native outgoing email. Both the 6-digit code emails and
# the admin notifications to denis@uncap.com go through this binding.
#
# CONSTRAINT: send_email can only deliver to addresses that are already
# registered + verified as Destination Addresses in Cloudflare Email
# Routing on the uncap.com zone. Sends to unverified addresses fail
# with an error. That means every client who will receive a 6-digit
# code must first be added at Email → Email Routing → Destination
# addresses and click the verification link Cloudflare emails them.
[[send_email]]
name = "NOTIFY_MAIL"

[vars]
NOTIFY_EMAIL = "denis@uncap.com"
EMAIL_FROM   = "Uncap Blueprint <hey@uncap.com>"
# Typing this string in the email field on any blueprint's login bypasses
# the 6-digit code step. Plain-text on purpose so admins can edit it
# without touching secrets; rotate by editing this line.
ADMIN_PASSCODE = "Uncap#CH"
