name = "uncap-blueprint"
main = "worker/index.js"
compatibility_date = "2025-04-01"
account_id = "0ff8ba3297e0672ce4b1b53f66496300"
workers_dev = false
preview_urls = false

# Preserve plaintext Variables that are set in the Cloudflare dashboard but
# not declared here. Without this, `wrangler deploy` strips them on every
# deploy. Secrets are always preserved regardless.
keep_vars = true

routes = [
  { pattern = "blueprint.uncap.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Where fit-call form submissions and card-on-file notifications are emailed.
NOTIFY_EMAIL = "hay@uncap.com"
# From-address shown to recipient. Must be on a domain you've verified in Resend
# (or use Resend's default "onboarding@resend.dev" for testing).
EMAIL_FROM = "Blueprint Fit Call <onboarding@resend.dev>"

# Stripe and Resend credentials are configured in the Cloudflare dashboard:
#   Workers & Pages → uncap-blueprint → Settings → "Variables and Secrets"
#
# Required:
#   STRIPE_SECRET_KEY       (Secret)    — sk_test_… / sk_live_…
#   STRIPE_PUBLISHABLE_KEY  (Variable)  — pk_test_… / pk_live_…  (public, plaintext)
#   RESEND_API_KEY          (Secret)    — from https://resend.com/api-keys
#   ADMIN_TOKEN             (Secret)    — random token gating /api/admin/charge
#                                         and the /admin one-click charge page
#
# Wrangler does not touch secrets or dashboard-only variables on deploy, so
# once they're set there they persist across every deploy from this repo.
