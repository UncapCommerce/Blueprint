<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book a Fit Call — Uncap Blueprint</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-32.png"/>
<link rel="stylesheet" href="/colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  ::selection{background:var(--uc-signal);color:var(--uc-black)}

  .uc-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:5px;font-weight:600;font-size:15px;font-family:var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all .15s var(--ease-out);text-decoration:none;line-height:1;white-space:nowrap}
  .uc-btn.b-primary{background:var(--uc-brand);color:#fff}
  .uc-btn.b-primary:hover{background:var(--uc-brand-hover)}
  .uc-btn.b-signal{background:var(--uc-signal);color:var(--uc-black)}
  .uc-btn.b-signal:hover{background:#d8ee3c}
  .uc-btn span{transition:transform .15s var(--ease-out);display:inline-block}
  .uc-btn:hover span{transform:translateX(3px)}
  a{color:inherit}

  @keyframes quizFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============== MOBILE FIT-CALL EXPERIENCE ============== */
  @media (max-width: 640px) {
    /* Header — same treatment as quiz */
    header > div { padding: 10px 16px 14px !important; gap: 10px !important; }
    header img[alt="Uncap"] { height: 18px !important; }
    header > div > button { left: 12px !important; padding: 6px 8px !important; font-size: 12px !important; }

    /* Main step container */
    main { padding: 24px 18px 56px !important; }

    /* Step typography */
    main h1 {
      font-size: clamp(26px, 7.6vw, 34px) !important;
      line-height: 1.08 !important;
      letter-spacing: -0.02em !important;
      margin-bottom: 10px !important;
    }
    main h1 + p { font-size: 16px !important; margin-bottom: 24px !important; }

    /* OptionGrid — collapse 2-col to 1-col */
    main [style*="grid-template-columns:repeat(2, 1fr)"] {,
  main [style*="grid-template-columns: repeat(2, 1fr)"] {
      grid-template-columns: 1fr !important;
    }
    main [style*="grid-template-columns:1fr"] > button {,
  main [style*="grid-template-columns: 1fr"] > button {
      padding: 18px 18px !important;
      font-size: 16px !important;
    }

    /* Form Phone/Company stack */
    main form > div[style*="grid-template-columns:1fr 1fr"] {,
  main form > div[style*="grid-template-columns: 1fr 1fr"] {
      grid-template-columns: 1fr !important;
    }

    /* All form inputs — 16px to prevent iOS zoom-on-focus */
    main input, main textarea {
      font-size: 16px !important;
    }

    /* Submit button full width */
    main form > button[type="submit"] {
      width: 100% !important;
      justify-content: center !important;
      padding: 18px 24px !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="/components/_hooks.jsx"></script>
<script type="text/babel" src="/components/FitCallApp.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<FitCallApp/>);
</script>
</body>
</html>
