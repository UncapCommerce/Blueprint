<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wichelt Imports - Uncap Blueprint</title>
<link rel="icon" href="assets/uncap-logo-black.svg"/>

<meta name="ext-resource-dependency" content="assets/uncap-logo-black.svg" data-resource-id="uncapLogoBlack"/>
<meta name="ext-resource-dependency" content="assets/uncap-logo-white.svg" data-resource-id="uncapLogoWhite"/>
<meta name="ext-resource-dependency" content="assets/shopify-platinum-partner-black.svg" data-resource-id="shopifyBadge"/>

<script>
  if (!window.__resources) {
    window.__resources = {
      uncapLogoBlack: 'assets/uncap-logo-black.svg',
      uncapLogoWhite: 'assets/uncap-logo-white.svg',
      shopifyBadge:   'assets/shopify-platinum-partner-black.svg',
      bgVector1:      '/assets/bg-vector-1.svg',
      bgVector2:      '/assets/bg-vector-2.svg',
      reviewBrandt:   'assets/review-brandt.webp'
    };
  }
  // ── Brand config — change `name`, or set `logoSrc` to an uploaded image path,
  //    and the company name + logo update everywhere they're used. ──
  window.__brand = window.__brand || {
    name: 'Wichelt',
    logoSrc: ''   // e.g. 'assets/wichelt-logo.svg' — overrides the wordmark when set
  };
</script>

<template id="__bundler_thumbnail" data-bg-color="#F2EFE7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#F2EFE7"/>
    <text x="600" y="430" text-anchor="middle" font-family="serif" font-size="180" font-weight="700" fill="#0A0A0A">Blueprint</text>
    <rect x="120" y="490" width="960" height="20" fill="#E8FF52"/>
  </svg>
</template>

<link rel="stylesheet" href="colors_and_type.css?v=DEPLOY_HASH"/>
<link rel="stylesheet" href="page-shell.css?v=DEPLOY_HASH"/>

</head>
<body>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>

<script type="text/babel" src="/legal/UncapMSA.jsx?v=DEPLOY_HASH"></script>
<script type="text/babel" src="components/blueprint/BlueprintSections.jsx?v=DEPLOY_HASH"></script>
<script type="text/babel" src="/admin/AdminToolbar.jsx?v=DEPLOY_HASH"></script>

<script type="text/babel">
  // ── Auth gate: email → 6-digit code → 24-hour session token.
  // Team/admin access comes from the admin dashboard, which silently
  // mints a preview session via /api/admin/bp-token. Token is held in
  // window.__bpToken so the BPApproveButton (in BlueprintSections.jsx)
  // can read it and POST the approve notification when clicked. ──
  const BLUEPRINT_ID = 'wichelt';
  window.__blueprintId = BLUEPRINT_ID;
  const STORAGE_KEY  = 'bp_token_wichelt';

  function Gate({ children }) {
    // No blueprint passcode: the portal login is the only gate. A signed-in
    // portal customer (or Uncap admin) gets a viewing token minted from
    // their session cookie; anyone else is sent to the portal to sign in.
    const [token, setToken]   = React.useState('');
    const [denied, setDenied] = React.useState(false);

    React.useEffect(() => {
      let dead = false;
      fetch('/api/admin/bp-token', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ blueprintId: BLUEPRINT_ID }),
      })
        .then((r) => r.json().catch(() => null))
        .then((d) => {
          if (dead) return;
          if (d && d.ok && d.token) {
            try { window.sessionStorage.setItem(STORAGE_KEY, d.token); } catch (_) {}
            setToken(d.token);
          } else {
            setDenied(true);
          }
        })
        .catch(() => { if (!dead) setDenied(true); });
      return () => { dead = true; };
    }, []);

    if (token) {
      if (typeof window !== 'undefined') window.__bpToken = token;
      return children;
    }
    if (denied) {
      if (typeof window !== 'undefined') {
        try { (window.top || window).location.replace('/'); } catch (_) { window.location.replace('/'); }
      }
      return null;
    }
    return (
      <div style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'var(--uc-cream)', color: 'var(--fg-3)',
        fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.12em'
      }}>LOADING…</div>
    );
  }

  function App() {
    return (
      <Gate>
        <div id="top">
          <BPNav/>
          <main>
            <BPIntro/>
            <BPSummary/>
            <BPWhere/>
            <BPObjectives/>
            <BPApproach/>
            <BPScope/>
            <BPPerformance/>
            <BPContent/>
            <BPTechStack/>
            <BPB2B/>
            <BPAgentic/>
            <BPMigration/>
            <BPDelivery/>
            <BPInvestment/>
            <BPPhase2/>
            <BPGrowth/>
            <BPTeam/>
            <BPWhy/>
            <div id="talk"><BPNext/></div>
          </main>
        </div>
      </Gate>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
