<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Start the Blueprint · Uncap</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-32.png"/>

<!-- Critical-path third-party origins. Stripe.js is required for Express
     Checkout on this quiz, so warm the connection early. -->
<link rel="preconnect" href="https://js.stripe.com" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<link rel="preload" as="font" type="font/woff2" href="/fonts/Inter_18pt-Regular.woff2" crossorigin/>
<link rel="preload" as="font" type="font/woff2" href="/fonts/Inter_24pt-ExtraBold.woff2" crossorigin/>

<link rel="stylesheet" href="/colors_and_type.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap"/>

<!-- Stripe.js is render-blocking only when we hit the payment step; defer
     it so it doesn't compete with React/Babel during initial paint. The
     quiz mounts first, the Express Checkout Element loads on the last
     step where Stripe will already be cached. -->
<script src="https://js.stripe.com/v3/" defer></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3P6Y3163D9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-3P6Y3163D9');
</script>
<style>
  html,body{margin:0;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  ::selection{background:var(--uc-signal);color:var(--uc-black)}

  .uc-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:5px;font-weight:600;font-size:15px;font-family:var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all .15s var(--ease-out);text-decoration:none;line-height:1;white-space:nowrap}
  .uc-btn.b-primary{background:var(--uc-brand);color:#fff}
  .uc-btn.b-primary:hover{background:var(--uc-brand-hover)}
  .uc-btn.b-signal{background:var(--uc-signal);color:var(--uc-black)}
  .uc-btn.b-signal:hover{background:#d8ee3c}
  .uc-btn span{transition:transform .15s var(--ease-out);display:inline-block}
  .uc-btn:hover span{transform:translateX(3px)}
  a{color:inherit}

  @keyframes quizFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============== MOBILE QUIZ EXPERIENCE ==============
     Optimized for thumb-reach + iOS no-zoom + tight conversion path.
     Targets the inline styles produced by QuizApp.jsx; uses !important
     to override React's element-level styles. */
  @media (max-width: 640px) {
    /* Header: tighter padding, smaller logo, less intrusive Back button */
    header > div { padding: 10px 16px 14px !important; gap: 10px !important; }
    header img[alt="Uncap"] { height: 18px !important; }
    header > div > button { left: 12px !important; padding: 6px 8px !important; font-size: 12px !important; }

    /* Main step container: less side padding, less bottom (no fixed bar here) */
    main { padding: 24px 18px 56px !important; }

    /* Step typography: smaller display headline */
    main h1 {
      font-size: clamp(26px, 7.6vw, 34px) !important;
      line-height: 1.08 !important;
      letter-spacing: -0.02em !important;
      margin-bottom: 10px !important;
    }
    main h1 + p { font-size: 16px !important; margin-bottom: 24px !important; }

    /* OptionGrid: collapse 2-col to 1-col so option cards are full width */
    main [style*="grid-template-columns:repeat(2, 1fr)"] {,
  main [style*="grid-template-columns: repeat(2, 1fr)"] {
      grid-template-columns: 1fr !important;
    }

    /* OptionGrid card: bigger tap target, allow the label to wrap */
    main [style*="grid-template-columns:1fr"] > button {,
  main [style*="grid-template-columns: 1fr"] > button {
      padding: 18px 18px !important;
      font-size: 16px !important;
    }

    /* Free-text inputs (text/email/url): font-size must be >16px to dodge
       iOS Safari's auto-zoom-on-focus. 16px sits right at the boundary and
       some iOS builds round below the threshold, so we ship 17px to be safe.
       Targets every input type the quiz renders, not just type=text. */
    main input { font-size: 17px !important; padding: 16px 18px !important; }
    main input + button { width: 100% !important; justify-content: center !important; }

    /* ----- Confirmation step (Place Order screen) ----- */
    /* Recap card: stack label/value rather than 180px-1fr two-col */
    main [style*="grid-template-columns:180px 1fr"] {,
  main [style*="grid-template-columns: 180px 1fr"] {
      grid-template-columns: 1fr !important;
      gap: 4px !important;
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }
    main [style*="grid-template-columns:180px 1fr"] span:first-child { font-size: 10px !important; },
  main [style*="grid-template-columns: 180px 1fr"] span:first-child { font-size: 10px !important; }
    main [style*="grid-template-columns:180px 1fr"] span:last-child { font-size: 15px !important; },
  main [style*="grid-template-columns: 180px 1fr"] span:last-child { font-size: 15px !important; }

    /* Price + Place Order card: stack price above button, button full width */
    main [style*="grid-template-columns:1fr auto"] {,
  main [style*="grid-template-columns: 1fr auto"] {
      grid-template-columns: 1fr !important;
      gap: 18px !important;
    }
    main [style*="grid-template-columns:1fr auto"] a {,
  main [style*="grid-template-columns: 1fr auto"] a {
      width: 100% !important;
      justify-content: center !important;
    }

    /* Trust row below Place Order: smaller, centered */
    main [style*="font-size:13px"][style*="color:var(--fg-3)"] { gap: 16px !important; },
  main [style*="font-size: 13px"][style*="color: var(--fg-3)"] { gap: 16px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Vendored under /vendor/ — same-origin so the worker's cache headers
     apply, and we drop the third-party RTT to unpkg. -->
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>

<!-- ?v=DEPLOY_HASH is substituted with the short commit SHA by
     scripts/stamp-deploy.js so every deploy invalidates the JSX cache. -->
<script type="text/babel" src="/components/_hooks.jsx?v=DEPLOY_HASH"></script>
<script type="text/babel" src="/components/QuizApp.jsx?v=DEPLOY_HASH"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<QuizApp/>);
</script>
</body>
</html>
