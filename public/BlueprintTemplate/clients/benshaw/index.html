<head>

<script>
  if (!window.__resources) {
    window.__resources = {
      uncapLogoBlack: '/BlueprintTemplate/assets/uncap-logo-black.svg',
      uncapLogoWhite: '/BlueprintTemplate/assets/uncap-logo-white.svg',
      shopifyBadge:   '/BlueprintTemplate/assets/shopify-platinum-partner-black.svg',
      bgVector1:      '/assets/bg-vector-1.svg',

    };
  }
</script>

  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#F2EFE7"/>
    <text x="600" y="430" text-anchor="middle" font-family="serif" font-size="180" font-weight="700" fill="#0A0A0A">Blueprint</text>

  </svg>

<link rel="stylesheet" href="colors_and_type.css?v=DEPLOY_HASH"/>
<link rel="stylesheet" href="page-shell.css?v=DEPLOY_HASH"/>

</head>
<body>
<div id="root"></div>

<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>

<script type="text/babel" src="/legal/UncapMSA.jsx?v=DEPLOY_HASH"></script>
<script type="text/babel" src="components/blueprint/BlueprintSections.jsx?v=DEPLOY_HASH"></script>
<script type="text/babel" src="/admin/AdminToolbar.jsx?v=DEPLOY_HASH"></script>

<script type="text/babel">
  // ── Auth gate: portal login is the only gate. A signed-in portal customer
  // (or Uncap admin) gets a viewing token minted from their session cookie via
  // /api/admin/bp-token; anyone else is sent to the portal to sign in. Token is
  // held in window.__bpToken so the BPApproveButton (in BlueprintSections.jsx)
  // can read it and POST the approve notification when clicked. ──
  // One page serves every Template-based blueprint, so the id comes from the
  // URL: /<companyId>/blueprint[/app] or /blueprint/<id>/ (admin preview).
  const SEG = location.pathname.split('/').filter(Boolean);
  const BLUEPRINT_ID = (SEG[0] === 'blueprint' ? SEG[1] : SEG[0]) || 'template';
  window.__blueprintId = BLUEPRINT_ID;
  const STORAGE_KEY  = 'bp_token_' + BLUEPRINT_ID;

  function Gate({ children }) {
    const [token, setToken]   = React.useState('');
    const [denied, setDenied] = React.useState(false);

    React.useEffect(() => {
      let dead = false;
      fetch('/api/admin/bp-token', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ blueprintId: BLUEPRINT_ID }),
      })
        .then((r) => r.json().catch(() => null))
        .then((d) => {
          if (dead) return;
          if (d && d.ok && d.token) {
            try { window.sessionStorage.setItem(STORAGE_KEY, d.token); } catch (_) {}
            if (typeof window !== 'undefined') window.__bpExpiresAt = d.expiresAt || '';
            if (typeof window !== 'undefined') window.__bpCompany = d.company || null;
            // Template data: number + dates, and the wireframe copy pulled
            // from the company website.
            window.__bpInfo = d.blueprint || null;
            window.__bpSite = (d.blueprint && d.blueprint.site) || null;
            if (d.company && d.company.name) document.title = d.company.name + ' - Uncap Blueprint';
            // Wireframes wear the client's profile colors from the GO app.
            const pal = d.company && d.company.palette;
            if (pal) {
              document.documentElement.style.setProperty('--co-prime', pal.prime);
              document.documentElement.style.setProperty('--co-accent', pal.accent);
            }
            setToken(d.token);
          } else {
            setDenied(true);
          }
        })
        .catch(() => { if (!dead) setDenied(true); });
      return () => { dead = true; };
    }, []);

    if (token) {
      if (typeof window !== 'undefined') window.__bpToken = token;
      return children;
    }
    if (denied) {
      if (typeof window !== 'undefined') {
        try { (window.top || window).location.replace('/'); } catch (_) { window.location.replace('/'); }
      }
      return null;
    }
    return (
      <div style={{
        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'var(--uc-cream)', color: 'var(--fg-3)',
        fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.12em'
      }}>LOADING…</div>
    );
  }


  function App() {
    return (
      <Gate>
        <div id="top">
          <BPNav/>
          <main>
            <BPIntro/>
            <BPSummary/>
            <BPWhere/>
            <BPObjectives/>
            <BPApproach/>
            <BPScope/>
            <BPPerformance/>
            <BPContent/>
            <BPTechStack/>
            <BPB2B/>
            <BPAgentic/>
            <BPIntegrations/>
            <BPMigration/>
            <BPDelivery/>
            <BPRiskAssessment/>
            <BPInvestment/>
            <BPGrowth/>
            <BPTeam/>
            <BPWhy/>
            <BPProof/>
            <div id="talk"><BPNext/></div>
          </main>
        </div>
      </Gate>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
