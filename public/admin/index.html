<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Charge — Blueprint admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="stylesheet" href="/colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  ::selection{background:var(--uc-signal);color:var(--uc-black)}
  main{max-width:560px;margin:0 auto;padding:64px 24px 96px}
  h1{font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-.02em;margin:0 0 8px}
  .lead{font-size:15px;color:var(--fg-2);margin:0 0 32px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--line-1);border-radius:5px;padding:24px;box-shadow:0 4px 16px rgba(10,10,10,0.05)}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--fg-2)}
  input{font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line-1);border-radius:5px;color:var(--fg-1);background:#fff;outline:none;transition:border-color .15s var(--ease-out)}
  input:focus{border-color:var(--uc-black)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  button{font:inherit;font-size:15px;font-weight:600;padding:14px 22px;border-radius:5px;border:none;cursor:pointer;background:var(--uc-black);color:#fff;transition:background .15s var(--ease-out)}
  button:hover:not(:disabled){background:#222}
  button:disabled{opacity:.5;cursor:default}
  .out{margin-top:18px;padding:16px 18px;border-radius:5px;font-size:14px;line-height:1.5;word-break:break-word}
  .ok{background:#e8f6ec;color:#1f6f3b;border:1px solid #c5e7d2}
  .auth{background:#fff7e6;color:#7a5400;border:1px solid #f3d896}
  .err{background:#fbeaea;color:#9a2424;border:1px solid #f0c4c4}
  .out h3{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .out p{margin:0 0 10px}
  .out code{font-family:var(--font-mono);font-size:13px;background:rgba(10,10,10,0.06);padding:2px 6px;border-radius:3px}
  .url-row{display:flex;gap:8px;align-items:stretch;margin-top:8px}
  .url-row input{flex:1;font-family:var(--font-mono);font-size:12px;padding:10px 12px;color:var(--fg-1);background:#fff;border-color:rgba(122,84,0,0.3)}
  .url-row .copy{padding:10px 14px;font-size:13px;background:#7a5400}
  .url-row .copy:hover:not(:disabled){background:#5e4100}
  .hint{font-size:12px;color:var(--fg-3);margin-top:4px;font-weight:400}
</style>
</head>
<body>
<main>
  <h1>Charge a saved card</h1>
  <p class="lead">After the fit call confirms scope, paste the Stripe customer ID and click Charge. Default is $7,500.</p>

  <form id="f">
    <label>
      Admin token
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token from the Worker secret" required/>
      <span class="hint">Stored only in your browser tab. Sent only to this Worker.</span>
    </label>

    <label>
      Stripe customer ID
      <input id="customer" type="text" autocomplete="off" placeholder="cus_…" required pattern="cus_[A-Za-z0-9]+"/>
    </label>

    <div class="row">
      <label>
        Amount (USD)
        <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" value="7500.00"/>
      </label>
      <label>
        Description
        <input id="description" type="text" value="Migration Blueprint"/>
      </label>
    </div>

    <button id="go" type="submit">Charge</button>
  </form>

  <div id="out" class="out" hidden></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const out = $('out');

  function show(kind, html) {
    out.className = 'out ' + kind;
    out.innerHTML = html;
    out.hidden = false;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    out.hidden = true;
    $('go').disabled = true;
    $('go').textContent = 'Charging…';

    const token = $('token').value.trim();
    const customerId = $('customer').value.trim();
    const amountUsd = Number($('amount').value);
    const description = $('description').value.trim();

    if (!token || !customerId.startsWith('cus_') || !(amountUsd > 0)) {
      show('err', 'Token, cus_… ID, and a positive amount are required.');
      $('go').disabled = false;
      $('go').textContent = 'Charge';
      return;
    }

    try {
      const resp = await fetch('/api/admin/charge', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({
          customerId,
          amountCents: Math.round(amountUsd * 100),
          description,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        show('err', '<h3>Failed</h3><p>' + escapeHtml(data.error || ('Request failed (' + resp.status + ')')) + '</p>');
      } else if (data.status === 'requires_action') {
        const url = data.hostedInvoiceUrl || '';
        const dollars = (data.amount / 100).toFixed(2);
        show('auth',
          '<h3>3DS authentication needed</h3>' +
          '<p>This card needs a Strong Customer Authentication step (common on EU/UK cards).' +
          ' Send the customer this Stripe-hosted link — they’ll complete authentication and Stripe will charge $' + escapeHtml(dollars) + '.</p>' +
          '<p>Invoice: <code>' + escapeHtml(data.invoiceId || '—') + '</code></p>' +
          '<div class="url-row">' +
            '<input id="hosted-url" readonly value="' + escapeHtml(url) + '"/>' +
            '<button class="copy" type="button" onclick="(function(){' +
              'const i=document.getElementById(\'hosted-url\');i.select();document.execCommand(\'copy\');' +
              'this.textContent=\'Copied\';setTimeout(()=>{this.textContent=\'Copy\';},1400);' +
            '}).call(this)">Copy</button>' +
          '</div>'
        );
      } else {
        const dollars = (data.amount / 100).toFixed(2);
        show('ok',
          '<h3>Charged</h3>' +
          '<p>Status: <code>' + escapeHtml(data.status) + '</code></p>' +
          '<p>PaymentIntent: <code>' + escapeHtml(data.paymentIntentId) + '</code></p>' +
          '<p>Amount: $' + escapeHtml(dollars) + ' to <code>' + escapeHtml(customerId) + '</code></p>'
        );
      }
    } catch (err) {
      show('err', '<h3>Network error</h3><p>' + escapeHtml(err.message || String(err)) + '</p>');
    } finally {
      $('go').disabled = false;
      $('go').textContent = 'Charge';
    }
  });
</script>
</body>
</html>
